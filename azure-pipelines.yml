trigger: 
  branches: 
    include: 
      - master   # Change to main if required 
 
pool: 
  vmImage: 'windows-latest'
 
variables: 
  buildConfiguration: Release 
  serviceConnection: devopsassignment2 
  resourceGroupName: assignment2rg 
  webAppName: chetan-assignment2wa
  slotName: assignment2wa-assignment2stg
 
stages: 
- stage: Build 
  displayName: Build, test, and publish 
  jobs: 
  - job: BuildJob 
    displayName: Build ASP.NET Core application 
    steps: 
    - task: UseDotNet@2 
      displayName: Install .NET SDK 
      inputs: 
        packageType: sdk 
        version: 8.x   # Match your project SDK 
 
    - task: DotNetCoreCLI@2 
      displayName: Restore 
      inputs: 
        command: restore 
        projects: '**/*.csproj' 
 
    - task: DotNetCoreCLI@2 
      displayName: Build 
      inputs: 
        command: build 
        projects: '**/*.csproj' 
        arguments: '--configuration $(buildConfiguration) --no-restore' 
 
    - task: DotNetCoreCLI@2 
      displayName: Test 
      inputs: 
        command: test 
        projects: '**/*Tests.csproj' 
        arguments: '--configuration $(buildConfiguration) --no-build' 
      continueOnError: false 
 
    - task: DotNetCoreCLI@2 
      displayName: Publish web app 
      inputs: 
        command: publish 
        publishWebProjects: true 
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)' 
        zipAfterPublish: true 
 
    - task: PublishPipelineArtifact@1 
      displayName: Publish artifact 
      inputs: 
        targetPath: '$(Build.ArtifactStagingDirectory)' 
        artifact: webapp 
 
- stage: Deploy_Staging_QA 
  displayName: Deploy to Staging-QA 
  dependsOn: Build 
  condition: succeeded() 
  jobs: 
  - deployment: DeployStaging 
    displayName: Deploy artifact to slot 
    environment: Staging-QA 
    strategy: 
      runOnce: 
        deploy: 
          steps: 
          - download: current 
            artifact: webapp 
 
          - task: AzureWebApp@1 
            displayName: Deploy to staging-qa slot 
            inputs: 
              azureSubscription: '$(serviceConnection)' 
              appType: webApp
              appName: '$(webAppName)' 
              deployToSlotOrASE: true 
              resourceGroupName: '$(resourceGroupName)' 
              slotName: '$(slotName)' 
              package: '$(Pipeline.Workspace)/webapp/**/*.zip' 
 
- stage: Swap_To_Production 
  displayName: Swap Staging-QA to Production 
  dependsOn: Deploy_Staging_QA 
  condition: succeeded() 
  jobs: 
  - job: SwapSlots 
    displayName: Swap deployment slots 
    steps: 
    - task: AzureAppServiceManage@0 
      displayName: Swap staging-qa with production 
      inputs: 
        azureSubscription: '$(serviceConnection)' 
        Action: 'Swap Slots' 
        WebAppName: '$(webAppName)' 
        ResourceGroupName: '$(resourceGroupName)' 
        SourceSlot: '$(slotName)' 
